[package]
name = "wubi-typing-worker"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.5", features = ["d1"] }
# 锁定wasm-bindgen三件套版本，匹配worker-build 0.1.14内置的wasm-bindgen 0.2.105
wasm-bindgen = "=0.2.105"
js-sys = "=0.3.82"
web-sys = "=0.3.82"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bcrypt = "0.17"
getrandom = { version = "0.3", features = ["wasm_js"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
urlencoding = "2"
include_dir = "0.7"

[profile.release]
opt-level = "s"
lto = true
