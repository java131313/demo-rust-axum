# Application Configuration
server:
  host: "0.0.0.0"
  port: 3000
  log_level: "info"

database:
  # 数据库类型: "sqlite" 或 "mysql" 或 "postgres" 或 "redis" 或 "mongo"
  type: "sqlite"

  # SQLite配置（主数据库，可用SQLITE_PATH环境变量覆盖路径）
  sqlite:
    path: "data/app.db"
    max_connections: 10

  # MySQL配置
  mysql:
    host: "127.0.0.1"
    port: 3306
    username: "root"
    password: "sdsSDG123*^DD"
    database: "wubi"
    max_connections: 10

  # PostgreSQL配置
  postgres:
    host: "127.0.0.1"
    port: 5432
    username: "root"
    password: "root"
    database: "wubi"
    max_connections: 10

  # Redis配置（读缓存）。
  # 注意：生产环境的连接串不要写在这里（本文件进git仓库），
  # 通过 REDIS_URL 环境变量注入；连不上会自动降级为纯SQLite。
  redis:
    url: "redis://127.0.0.1:6379"
    max_connections: 10
    
  # MongoDB配置（默认使用）
  mongo:
    uri: "mongodb://127.0.0.1:27017"
    database: "wubi"
    max_pool_size: 10

auth:
  jwt_secret: "your-secret-key-change-in-production"
  token_expiration_hours: 24
