version: '3.8'

# 一体化部署：单个容器包含 Rust API + 嵌入式前端 + SQLite
# Redis缓存使用云端托管实例（可用REDIS_URL环境变量覆盖，连接失败自动降级为纯SQLite）

services:
  wubi-app:
    build: .
    container_name: wubi-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      RUST_LOG: info
      # SQLite数据库文件路径（容器内）
      SQLITE_PATH: /app/data/app.db
      # Redis读缓存：从同目录 .env 文件读取（.env 不进git仓库），
      # 未设置时自动降级为纯SQLite。参考 .env.example
      REDIS_URL: "${REDIS_URL:-}"
      # 生产环境务必修改
      JWT_SECRET: your-secret-key-change-in-production
    volumes:
      # 持久化SQLite数据文件
      - wubi_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  wubi_data:
    driver: local
